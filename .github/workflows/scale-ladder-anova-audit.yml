name: scale-ladder-anova-audit

on:
  push:
  pull_request:

jobs:
  scale-ladder-anova-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit dyadic scale-ladder ANOVA identities
        run: python src/scale_ladder_anova_gate.py --output-dir results
