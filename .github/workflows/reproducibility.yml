name: reproducibility

on:
  push:
  pull_request:

jobs:
  dsd-bridge-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run first-pass bridge checks
        run: python src/dsd_bridge_baseline.py --output-dir results
      - name: Run moving material-region checks
        run: python src/moving_material_region_baseline.py --output-dir results
      - name: Run moving control-volume energy checks
        run: python src/moving_control_energy_budget.py --output-dir results
      - name: Run material pullback geometry checks
        run: python src/material_pullback_bridge.py --output-dir results
      - name: Run material relative-difference gate
        run: python src/material_relative_difference_gate.py --output-dir results
      - name: Run mean-centered material oscillation gate
        run: python src/material_oscillation_gate.py --output-dir results
      - name: Run restartable material tube gate
        run: python src/restartable_material_tube_gate.py --output-dir results
      - name: Run pressure-difference localization gate
        run: python src/pressure_difference_kernel_gate.py --output-dir results
      - name: Run accelerating-frame symmetry gate
        run: python src/accelerating_frame_symmetry_gate.py --output-dir results
      - name: Run generalized Galilean suitable gate
        run: python src/generalized_galilean_suitable_gate.py --output-dir results
      - name: Run material oscillation critical L3 bridge
        run: python src/material_oscillation_l3_bridge.py --output-dir results
      - name: Run mean-flow moving-sphere gate
        run: python src/mean_flow_sphere_gate.py --output-dir results
      - name: Run pressure-free exponent bridge
        run: python src/pressure_free_exponent_bridge.py --output-dir results
      - name: Run mean-flow moving-sphere budget
        run: python src/mean_flow_sphere_budget.py --output-dir results
      - name: Run weighted mean-flow sphere gate
        run: python src/weighted_mean_sphere_gate.py --output-dir results
      - name: Run weighted variance local-energy lemma audit
        run: python src/weighted_variance_local_energy_lemma.py --output-dir results
      - name: Run weighted one-step channel closure
        run: python src/weighted_channel_closure_gate.py --output-dir results
      - name: Run Lagrangian diffusion metric gate
        run: python src/lagrangian_diffusion_metric_gate.py --output-dir results
      - name: Run Lagrangian metric cancellation audit
        run: python src/lagrangian_metric_cancellation_gate.py --output-dir results
      - name: Run critical-channel checks
        run: python src/critical_channel_baseline.py --output-dir results
      - name: Run translation/coupling checks
        run: python src/translation_coupling_baseline.py --output-dir results
      - name: Run critical L3 rate audit
        run: python src/critical_l3_rate_baseline.py --output-dir results
      - name: Run shell-to-local coarea checks
        run: python src/coarea_local_bridge.py --output-dir results
      - name: Run vorticity alignment checks
        run: python src/vorticity_alignment_baseline.py --output-dir results
      - name: Run vorticity occupancy-sparseness gate
        run: python src/vorticity_occupancy_sparseness_gate.py --output-dir results
      - name: Run vorticity direction-strain competition gate
        run: python src/vorticity_direction_strain_competition_gate.py --output-dir results
      - name: Run middle-eigenvalue residual branch gate
        run: python src/middle_eigenvalue_residual_branch_gate.py --output-dir results
      - name: Run derivative generating-function gate
        run: python src/derivative_channel_generating_gate.py --output-dir results
      - name: Run global vorticity covariance-axis gate
        run: python src/global_vorticity_axis_gate.py --output-dir results
      - name: Run projective vorticity-dispersion gate
        run: python src/projective_vorticity_dispersion_gate.py --output-dir results
      - name: Run projective vorticity-dispersion dynamics gate
        run: python src/projective_vorticity_dispersion_dynamics_gate.py --output-dir results
      - name: Run projective mixing-channel closure gate
        run: python src/projective_mixing_channel_closure_gate.py --output-dir results
      - name: Run derivative projective covariance-chain gate
        run: python src/derivative_projective_covariance_chain_gate.py --output-dir results
      - name: Run viscous derivative-order flux gate
        run: python src/viscous_derivative_order_flux_gate.py --output-dir results
      - name: Run factorial-normalized viscous budget gate
        run: python src/factorial_normalized_viscous_budget_gate.py --output-dir results
      - name: Run energy-weighted projective dissipation gate
        run: python src/energy_weighted_projective_dissipation_gate.py --output-dir results
      - name: Run covariance coercivity gate
        run: python src/covariance_coercivity_projective_gate.py --output-dir results
      - name: Run local covariance pairwise-projective gate
        run: python src/local_covariance_pairwise_projective_gate.py --output-dir results
      - name: Run local vorticity covariance-axis gate
        run: python src/local_vorticity_covariance_axis_gate.py --output-dir results
      - name: Run axis-conversion strain-variance gate
        run: python src/axis_conversion_strain_variance_gate.py --output-dir results
      - name: Run exact stretching coupling checks
        run: python src/stretching_coupling_baseline.py --output-dir results
      - name: Run vorticity direction-gradient checks
        run: python src/vorticity_direction_gradient_baseline.py --output-dir results
      - name: Run middle-eigenvalue alignment checks
        run: python src/middle_eigenvalue_alignment_baseline.py --output-dir results
      - name: Run strain-alignment gate checks
        run: python src/strain_alignment_gate_baseline.py --output-dir results
      - name: Run middle-eigenvalue growth bound
        run: python src/middle_eigenvalue_growth_bound.py --output-dir results
      - name: Run symmetric spherical energy budget
        run: python src/spherical_energy_budget.py --output-dir results
      - name: Run asymmetric spherical energy budget
        run: python src/asymmetric_spherical_budget.py --output-dir results
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
